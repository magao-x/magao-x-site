<?xml version="1.0" encoding="UTF-8" standalone="no"?><!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg width="100%" height="100%" viewBox="0 0 16 16" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xml:space="preserve" xmlns:serif="http://www.serif.com/" style="fill-rule:evenodd;clip-rule:evenodd;stroke-miterlimit:1.5;">
<defs>
  <!-- Tunable glow filter -->
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%" filterUnits="userSpaceOnUse"
          color-interpolation-filters="sRGB">
    <!-- Blur the source (stroke/fill) -->
    <feGaussianBlur in="SourceGraphic" stdDeviation="0.5" result="blur"/>
    <!-- Color the blur (optional; use if you want a specific glow color) -->
    <feFlood flood-color="#00E5FF" flood-opacity="1" result="glowColor"/>
    <feComposite in="glowColor" in2="blur" operator="in" result="coloredBlur"/>
    <!-- Stack glow behind the original -->
    <feMerge>
      <feMergeNode in="coloredBlur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>
