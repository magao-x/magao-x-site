  <path filter="url(#glow)" d="M13.86,7.8l0,-4.815l0.72,-1.005l-1.2,0l-0,-0.837l-1.32,-0.006l-0.595,0.843l-9.485,0l-0,7.353" style="fill:none;stroke:#fff;stroke-width:0.33px;"/>
